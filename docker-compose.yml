services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce_network
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecommerce
    ports: 
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
     - ecommerce_network
    
   frontend:
     build: ./frontend
     ports:
       - "3000:80"
     networks:
       - ecommerce_network
     depends_on:
       - backend

networks:
  ecommerce_network:

volumes:
  postgres_data:

