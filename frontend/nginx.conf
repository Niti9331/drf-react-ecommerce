server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://host.docker.internal:8000;
    }

    location /auth/ {
        proxy_pass http://host.docker.internal:8000;
    }

    location /admin/ {
        proxy_pass http://host.docker.internal:8000;
    }
}

